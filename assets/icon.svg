<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="50%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#080b12"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7f00ff" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Rectangle -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="#1f2c47" stroke-width="6"/>

  <!-- Subtle Inner Grid Glow -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#glowGrad)" stroke-width="2" stroke-dasharray="12 8" opacity="0.4"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.2"/>

  <!-- High-Speed Lightning & Download Arrow Combined Glyph -->
  <g filter="url(#neonGlow)" transform="translate(0, 0)">
    <!-- Download Arrow Shaft & Chevron -->
    <path d="M256 120 L256 310" stroke="url(#accentGrad)" stroke-width="32" stroke-linecap="round"/>
    <path d="M170 230 L256 316 L342 230" fill="none" stroke="url(#accentGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Base Tray / Storage Bar -->
    <path d="M140 370 L372 370" fill="none" stroke="#00f2fe" stroke-width="30" stroke-linecap="round"/>
    <circle cx="256" cy="370" r="8" fill="#ffffff"/>
  </g>

  <!-- Speed Bolts Accents -->
  <path d="M120 180 L145 220 L135 224 L155 260" fill="none" stroke="#00f2fe" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <path d="M392 180 L367 220 L377 224 L357 260" fill="none" stroke="#00f2fe" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
</svg>
